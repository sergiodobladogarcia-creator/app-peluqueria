<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101114">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Barber Studio</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="img/icono.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/icono.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app" id="app">
    <header class="top">
      <button class="brand" id="brand" aria-label="Inicio">
        <span class="logo" id="logo"></span>
        <span class="brand-name" id="brandName"></span>
      </button>
      <a class="ig-btn" id="igBtn" target="_blank" rel="noopener" aria-label="Instagram">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>
      </a>
    </header>

    <main id="views">
      <section class="view on" data-v="inicio" id="vInicio"></section>
      <section class="view" data-v="servicios" id="vServicios"></section>
      <section class="view" data-v="reservar" id="vReservar"></section>
      <section class="view" data-v="trabajos" id="vTrabajos"></section>
      <section class="view" data-v="citas" id="vCitas"></section>
    </main>

    <nav class="tabbar" id="tabbar"></nav>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="sheet-bg" id="sheetBg" hidden></div>
    <div class="sheet" id="sheet" hidden></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
